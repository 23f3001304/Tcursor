<div id="app">
  <header class="bar" data-tauri-drag-region>
    <span class="bar-title" data-tauri-drag-region>TCursor Setup</span>
    <button class="bar-close" data-close aria-label="Close">&#10005;</button>
  </header>

  <main class="stage">
    <section class="screen is-on" id="s-welcome">
      <svg class="glyph mark" viewBox="0 0 128 128" aria-hidden="true"><use href="#brand-mark"/></svg>
      <p class="eyebrow">Auto-zoom screen recorder</p>
      <h1>Install TCursor</h1>
      <p class="lede" id="welcome-size">Installed for you only.</p>
      <button class="btn" id="install">Install</button>
    </section>

    <section class="screen" id="s-installing">
      <p class="numeral"><span id="percent">0</span><span class="numeral-unit">%</span></p>
      <div class="track" id="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="fill" id="fill"></div>
      </div>
      <p class="lede" id="status" aria-live="polite">Preparing</p>
    </section>

    <section class="screen" id="s-done">
      <svg class="glyph check" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M6 16.5 L13 23.5 L26 9" />
      </svg>
      <h1>TCursor is installed</h1>
      <p class="lede">Opening it now.</p>
      <button class="btn" id="open">Open TCursor</button>
    </section>

    <section class="screen" id="s-error">
      <svg class="glyph alert" viewBox="0 0 32 32" aria-hidden="true">
        <path d="M16 8 V18" /><circle cx="16" cy="23.5" r="1.6" />
      </svg>
      <h1>Install failed</h1>
      <p class="message" id="message"></p>
      <div class="row">
        <button class="btn" id="retry">Retry</button>
        <button class="btn btn-quiet" id="copy">Copy log</button>
      </div>
    </section>
  </main>

  <footer class="rail">
    <span class="rail-fact" id="version"></span>
    <span class="rail-fact rail-path" id="destination"></span>
    <span class="rail-note" id="rail-note"></span>
  </footer>

  <div class="confirm" id="confirm" hidden>
    <span>Installing. Close anyway?</span>
    <button class="mini" id="confirm-yes">Yes</button>
    <button class="mini" id="confirm-no">No</button>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="sheet-head">License</div>
    <pre class="sheet-body" id="sheet-body"></pre>
    <button class="btn btn-quiet" id="sheet-close">Close</button>
  </div>
</div>

<script src="./app.js"></script>

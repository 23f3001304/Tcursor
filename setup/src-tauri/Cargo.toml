[package]
name = "tcursor-setup"
version = "0.1.0"
# Also the FileDescription in the exe's version resource, which is the name Task Manager shows.
description = "TCursor Setup"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Small, fast installer binary. The embedded NSIS payload dominates size anyway.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

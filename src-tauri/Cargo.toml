[package]
name = "tcursor-scaffold"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cursor_zoom_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
windows-capture = "1"
anyhow = "1"
cpal = "0.15"
dirs-next = "2"
fast_image_resize = "5"
wgpu = "22"
bytemuck = { version = "1", features = ["derive"] }
pollster = "0.3"
ab_glyph = "0.2"
ureq = { version = "2", features = ["json"] }
flate2 = "1.0"
png = "0.17"

[dependencies.windows]
version = "0.58"
features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry"]

# The SAME `windows` package as above, at the version windows-capture builds against, under a
# second name. NOT a second dependency: cargo unifies both entries onto the one 0.61.3 crate
# instance windows-capture already compiles, and every feature listed here is one it already
# enables - so nothing extra is downloaded, compiled, or linked.
#
# It has to be a direct entry because the D3D11 device, context and texture a WGC frame carries
# are 0.61's types, not 0.58's: two versions of the same interface are distinct Rust types, so
# `frame_scaler.rs` (which allocates the encoder's fixed canvas on that device and scales each
# resized frame into it) cannot name them through 0.58. Aliasing 0.61 is what makes them
# nameable without a transmute across crate versions.
[dependencies.wgc-windows]
package = "windows"
version = "0.61"
features = ["Graphics_DirectX_Direct3D11", "Win32_Foundation", "Win32_Graphics_Direct3D11", "Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common", "Win32_System_WinRT_Direct3D11"]


# Dev builds default to opt-level 0, which makes the export/preview pixel paths (33MB/frame
# readback copy, cursor blit, wgpu glue, ffmpeg buffer handling) 10-30x slower than release -
# the reason a debug export runs ~1x realtime even on a strong GPU. O1 on our crate + O3 on all
# deps (wgpu/image/png, compiled once and cached) restores near-release runtime; the only cost
# is a slower first build. Release is unaffected (already O3).
[profile.dev]
opt-level = 1
# Incremental + opt-level on Windows/MSVC triggers LNK2019 "unresolved external symbol .llvm.*"
# from optimized deps (fast_image_resize, serde) once the incremental cache accumulates edits, so
# `tauri dev` fails to LINK while `tauri build` (release: incremental off by default) builds fine.
# Turning incremental off for dev fixes it; rebuilds here are already ~40s (monolithic crate), so
# the lost caching costs almost nothing.
incremental = false

[profile.dev.package."*"]
opt-level = 3
